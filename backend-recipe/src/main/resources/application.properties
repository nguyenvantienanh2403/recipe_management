# =====================================================
# CẤU HÌNH CHÍNH - Recipe Management System
# =====================================================

# --- KẾT NỐI POSTGRESQL ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/recipe_db
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# --- HIBERNATE ORM ---
# Dùng drop-and-create lần đầu để tạo bảng, sau đó đổi sang update
quarkus.hibernate-orm.database.generation=drop-and-create
# Không dùng import.sql - DataInitializer xử lý seed data với BCrypt
# quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=false

# --- JWT AUTHENTICATION ---
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=recipe-app
quarkus.native.resources.includes=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem

# --- CORS (cho React Frontend kết nối) ---
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:5174
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-allow-credentials=true

# --- SWAGGER / OPENAPI ---
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# --- UPLOAD FILE (max 10MB) ---
quarkus.http.body.uploads-directory=uploads
quarkus.http.limits.max-body-size=10M

# --- SERVER PORT ---
quarkus.http.port=8080

# --- LOGGING ---
quarkus.log.level=INFO
quarkus.log.category."com.N24_LTJavaNangCao".level=DEBUG